# One Buttress v2 instance. Per deployment:
# - .production.env: BUTTRESS_APP_PATH=/app, BUTTRESS_MONGO_URL=<user>:<pass>@mongo, BUTTRESS_REDIS_HOST=redis
# - compose's own .env: REST_PORT / SOCK_PORT, equal to BUTTRESS_REST_LISTEN_PORT / BUTTRESS_SOCK_LISTEN_PORT
# - MongoDB runs elsewhere on the external Docker network `buttress`, as host `mongo`
x-buttress: &buttress
  build: .
  image: buttress:v2
  restart: unless-stopped
  depends_on: [redis]
  networks: [default, buttress]
  volumes:
    - ./.production.env:/app/.production.env:ro
    - ./app_data:/app/app_data
    - ./logs:/app/logs

services:
  rest:
    <<: *buttress
    ports: ["127.0.0.1:${REST_PORT}:${REST_PORT}"]

  socket:
    <<: *buttress
    command: ["node", "socket-app.js"]
    ports: ["127.0.0.1:${SOCK_PORT}:${SOCK_PORT}"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

networks:
  buttress:
    external: true
